<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>BookMarx Master Collection</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            margin: 20px;
            background-color: #f5f5f5;
        }
        
        .folder {
            margin-left: 20px;
        }

        .folder-name {
            cursor: pointer;
            padding: 5px;
            display: flex;
            align-items: center;
        }

        .folder-name:hover {
            background-color: #f0f0f0;
        }

        .folder-icon {
            font-family: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif;
            margin-right: 8px;
            font-size: 16px;
            display: inline-block;
            width: 16px;
        }

        .bookmark {
            margin-left: 40px;
            padding: 5px;
        }

        .bookmark a {
            text-decoration: none;
            color: inherit;
        }

        .bookmark a:hover {
            text-decoration: underline;
        }

        .collapsed {
            display: none;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Master Collection</h1>
        <div id="user-info"></div>
    </div>
    <div class="tree-container" id="bookmarkTree"></div>
    <script src="master-collection.js"></script>
</body>
</html>
